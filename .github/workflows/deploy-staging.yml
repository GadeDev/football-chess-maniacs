name: Deploy Staging

# Automatically deploy every main update to Football Chess ManiacS Staging.
# Manual exact-SHA deployment remains available as a fallback.
# Targets:
# - Worker: football-chess-maniacs-staging.yanagiho.workers.dev
# - Client: fcms-staging.pages.dev
# Production is untouched.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA to deploy to staging"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Validate commit SHA format
        run: |
          sha="$DEPLOY_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy SHA must be an exact 40-character hex commit SHA"
            exit 1
          fi
      - name: Require Cloudflare API token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Verify checked-out commit matches requested SHA
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out $actual, expected $DEPLOY_SHA"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Inventory Cloudflare resources
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo '=== WHOAMI ==='
          npx --yes wrangler@4 whoami || true
          echo '=== D1 ==='
          npx --yes wrangler@4 d1 list --json || true
          echo '=== KV ==='
          npx --yes wrangler@4 kv namespace list || true
          echo '=== R2 ==='
          npx --yes wrangler@4 r2 bucket list || true
          echo '=== QUEUES ==='
          npx --yes wrangler@4 queues list || true
          echo '=== PAGES ==='
          npx --yes wrangler@4 pages project list || true
      - name: Apply D1 migrations (best effort; no schema change in this release)
        continue-on-error: true
        run: npx --yes wrangler@4 d1 migrations apply fcms-staging --env staging --remote
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker (staging)
        run: npx --yes wrangler@4 deploy --env staging
        working-directory: src
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # build:staging bakes VITE_PLATFORM_API_URL=fc-platform-api-staging into the bundle
      # (PR #40). Plain `npm run build` would make the staging client talk to the
      # production Platform API while the staging Worker verifies JWTs against
      # Platform Staging, breaking every logged-in feature on staging.
      - run: npm run build:staging
      - name: Deploy client (staging Pages project)
        run: npx --yes wrangler@4 pages deploy dist --project-name=fcms-staging --branch=main --commit-hash "$DEPLOY_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
